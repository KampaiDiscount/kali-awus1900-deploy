name: Feature request
description: Propose a focused compatibility, diagnostic, packaging, or safety improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete failure mode or maintenance burden.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility considerations
      description: Explain effects on package trust, kernel modules, USB ownership, and default wireless behavior.
    validations:
      required: true
